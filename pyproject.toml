[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-requirements-parser"
version = "0.1.0"
description = "Multi-vendor LLM extraction of access control requirements"
requires-python = ">=3.11"

dependencies = [
    # LLM Vendors
    "google-genai>=0.1.0",
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    
    # Embeddings & Retrieval
    "sentence-transformers>=2.2.0",
    
    # Data & Validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    
    # Configuration
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-repeat>=0.9.0",
]